<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form action="nameServlet" method="post">
    <input type="text" placeholder="User Name" name="name">
    <button type="submit">Submit</button>
</form>

<form action="ageServlet" method="post">
    <input type="number" placeholder="User Age" name="age">
    <button type="submit">Submit</button>
</form>

<form action="emailServlet" method="post">
    <input type="text" placeholder="User Email" name="email">
    <button type="submit">Submit</button>
</form>
<form action="paswordServlet" method="post">
    <input type="text" placeholder="Password" name="password">
    <input type="text" placeholder="Confirm password" name="confirmPassword">
    <button type="submit">Submit</button>
</form>

</body>
</html>
