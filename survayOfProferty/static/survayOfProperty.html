<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<form action="survayOfProperty" method="post">

    <div class="mb-3">
        <label for="exampleInputname1" class="form-label">Enter name</label>
        <input type="text" class="form-control" id="exampleInputname1" name="name">
    </div>

    <div class="mb-3">
        <label for="exampleInputRegistration1" class="form-label">Enter Registration Number</label>
        <input type="text" class="form-control" id="exampleInputRegistration1" name="registration">
    </div>

    <div class="mb-3">
        <label for="exampleInputAge1" class="form-label">Enter Age</label>
        <input type="number" class="form-control" id="exampleInputAge1" name="age">
    </div>

    <div class="mb-3">
        <label for="exampleInputFatherName1" class="form-label">Enter Father name</label>
        <input type="text" class="form-control" id="exampleInputFatherName1" name="fatherName">
    </div>

    <div class="mb-3">
        <label for="exampleInputMotherName1" class="form-label">Enter Mother name</label>
        <input type="text" class="form-control" id="exampleInputMotherName1" name="motherName">
    </div>

    <div class="mb-3">
        <label for="exampleInputLocation1" class="form-label">Enter Location</label>
        <input type="text" class="form-control" id="exampleInputLocation1" name="location">
    </div>

    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="email">
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
    </div>

    <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">New Password</label>
        <input type="password" class="form-control" id="exampleInputPassword1" name="newPassword">
    </div>

    <div class="mb-3">
        <label for="exampleInputPassword2" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="exampleInputPassword2" name="confirmPassword">
    </div>

    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1" name="check">
        <label class="form-check-label" for="exampleCheck1">Check me out</label>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
